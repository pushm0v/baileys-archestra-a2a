# Bridge only (Archestra runs elsewhere):   docker compose up -d
# Bridge + Archestra on this host:          docker compose --profile archestra up -d
# Runner for the dashboard (many numbers):  docker compose --profile runner up -d runner
#   (settings in .env.runner; see .env.runner.example and dashboard/README.md)
#
# First run: watch the logs and scan the QR code with WhatsApp > Linked devices
#   docker compose logs -f bridge

services:
  bridge:
    build: .
    image: baileys-archestra-a2a:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    extra_hosts:
      - "host.docker.internal:host-gateway" # reach an Archestra running on the Docker host (Linux)
    volumes:
      - ${BRIDGE_DATA:-bridge-data}:/data # set BRIDGE_DATA=./data in .env to use a host folder
      - ./certs:/certs:ro # extra CA certificates; see NODE_EXTRA_CA_CERTS in .env.example
    tty: true # renders the pairing QR code cleanly in `docker compose logs`

  runner:
    profiles: ["runner"]
    build: .
    image: baileys-archestra-a2a:latest
    command: ["node", "src/runner.mjs"]
    restart: unless-stopped
    env_file: .env.runner
    environment:
      DATA_DIR: /data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - runner-data:/data # one session folder per number, plus the last settings from the dashboard
      - ./certs:/certs:ro

  archestra:
    profiles: ["archestra"]
    image: archestra/platform:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000" # UI
      - "127.0.0.1:9000:9000" # API (LLM/MCP proxy, A2A)
    environment:
      ARCHESTRA_QUICKSTART: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # lets quickstart run MCP servers
      - archestra-postgres-data:/var/lib/postgresql/data
      - archestra-app-data:/app/data

volumes:
  bridge-data:
  runner-data:
  archestra-postgres-data:
  archestra-app-data:
