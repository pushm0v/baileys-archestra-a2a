# The bridge holds one WhatsApp linked-device session, so it always runs as a single
# replica with the Recreate strategy (two pods on one session would kick each other off).

image:
  repository: ghcr.io/pushm0v/baileys-archestra-a2a
  tag: "" # defaults to the chart appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

archestra:
  # Backend URL (no trailing slash), e.g. http://archestra.archestra.svc:9000 or https://archestra.example.com
  url: ""
  # Agent to invoke (Agent Triggers > Webhook / A2A shows the agent ID)
  agentId: ""
  # Bearer token. Ignored when existingSecret is set.
  token: ""
  # Use a Secret you manage instead of `token`
  existingSecret: ""
  existingSecretKey: token

# Phone numbers (country code, no +) allowed to talk to the default agent in direct chats.
# Empty allows anyone. Has no effect in groups: a routed group is open to all its members
# unless the route sets `allowedNumbers`, and groups without a route get no answers.
allowedNumbers: []

# Bind WhatsApp groups (or specific phone numbers) to their own Archestra agent.
# Groups without a route are ignored; the bridge logs their JID ("unmapped group …") the
# first time they send a message, or `@bot /chatid` in the group replies with it.
# In groups the bot only answers when @mentioned, unless trigger is "all".
# Route tokens default to archestra.token; use "env:NAME" with extraEnv to read one from a Secret.
routes: {}
#  "120363041234567890@g.us":
#    name: ops
#    agentId: 5650c819-345a-4d05-82f7-b901ba5dba1f
#  "120363049876543210@g.us":
#    name: sales
#    agentId: 9a1b...
#    url: https://other-archestra.example.com   # default: archestra.url
#    token: env:SALES_TOKEN                     # default: archestra.token
#    trigger: mention                           # mention (default) | all
#    allowedNumbers: ["6281234567890"]          # default: any group member
#  "6281234567890":
#    agentId: ...                               # direct chats from this number

agentTimeoutMs: 300000
# pino log level for Baileys: fatal | error | warn | info | debug | trace
logLevel: warn

media:
  # Attachment kinds to forward: image, document, audio, video, sticker
  types: [image, document]
  maxMb: 10
  # auto | always | never (see README "Inline file support")
  inline: auto

# Extra CA certificates (PEM) to trust, for an Archestra behind a private/company CA.
# Either paste the PEM in `pem`, or point at an existing ConfigMap/Secret key.
caBundle:
  pem: ""
  existingConfigMap: ""
  existingSecret: ""
  key: ca.pem

# Stores the WhatsApp session (/data/auth) and the chat -> contextId map.
# Without persistence every pod restart needs a new QR scan.
persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes: [ReadWriteOnce]
  size: 1Gi
  annotations: {}

extraEnv: []
#  - name: SALES_TOKEN          # referenced by a route as token: env:SALES_TOKEN
#    valueFrom:
#      secretKeyRef: { name: sales-archestra, key: token }

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000 # the `node` user in node:22-alpine
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}
