{{- $runner := eq .Values.mode "runner" }}
{{- $archestraToken := and (not .Values.archestra.existingSecret) (or (not $runner) .Values.archestra.token) }}
{{- $runnerToken := and $runner (not .Values.runner.existingSecret) }}
{{- if or $archestraToken $runnerToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bridge.fullname" . }}
  labels:
    {{- include "bridge.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $archestraToken }}
  {{ .Values.archestra.existingSecretKey }}: {{ required "archestra.token (or archestra.existingSecret) is required" .Values.archestra.token | quote }}
  {{- end }}
  {{- if $runnerToken }}
  {{ .Values.runner.existingSecretKey }}: {{ required "runner.token (or runner.existingSecret) is required in runner mode" .Values.runner.token | quote }}
  {{- end }}
{{- end }}
